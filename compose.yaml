services:
  web:
    build: .
    image: voltops:local
    ports: ["${VOLTOPS_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file: .env
    environment:
      DATABASE_PATH: /data/voltops.db
    volumes:
      - voltops-data:/data
    restart: unless-stopped

  worker:
    image: voltops:local
    command: ["node", "dist/worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_PATH: /data/voltops.db
    volumes:
      - voltops-data:/data
    restart: unless-stopped

volumes:
  voltops-data:
